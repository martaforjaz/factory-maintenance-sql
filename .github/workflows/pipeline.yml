name: Pipeline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run.py
      - run: python -m unittest discover -s tests -v
      - run: |
          python figures.py
          git diff --exit-code -- figures
